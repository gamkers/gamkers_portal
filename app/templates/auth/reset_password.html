{% extends "base.html" %}
{% block title %}Choose a new password · GAMKERS PORTAL{% endblock %}
{% block content %}
<section class="auth-layout auth-centered">
  <form class="panel auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">ACCOUNT RECOVERY</p><h2>Choose a new password</h2><p class="muted">Use at least 12 characters.</p>
    <label class="field-label" for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <button class="button button-primary button-full" type="submit">Update password <span>↗</span></button>
  </form>
</section>
{% endblock %}
