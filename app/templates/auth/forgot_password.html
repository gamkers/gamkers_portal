{% extends "base.html" %}
{% block title %}Reset your password · GAMKERS PORTAL{% endblock %}
{% block content %}
<section class="auth-layout auth-centered">
  <form class="panel auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">ACCOUNT RECOVERY</p><h2>Forgot your password?</h2><p class="muted">If your email matches an account, we'll send a secure reset link.</p>
    <label class="field-label" for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
    <button class="button button-primary button-full" type="submit">Send reset link <span>↗</span></button>
    <p class="form-bottom"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </form>
</section>
{% endblock %}
