{% extends "base.html" %}
{% block title %}Join {{ invitation.organization.name }} · GAMKERS PORTAL{% endblock %}
{% block content %}
<section class="auth-layout auth-centered">
  <form class="panel auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">TEAM INVITATION</p><h2>Join GAMKERS PORTAL</h2><p class="muted">Create a {{ invitation.role }} account for {{ invitation.email }}.</p>
    <label class="field-label" for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="120" required>
    <label class="field-label" for="password">Password <span class="muted">(12 characters minimum)</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <button class="button button-primary button-full" type="submit">Join the portal <span>↗</span></button>
  </form>
</section>
{% endblock %}
